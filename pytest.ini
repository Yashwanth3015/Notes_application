#it is a centralized configuration file used to control Pytest execution behavior and framework settings.
[pytest]

addopts =
    -v
    --alluredir=reports
    --reruns 2
    --reruns-delay 2

python_files = test_*.py

testpaths = tests

markers =
   ui: UI automation tests
    api: API automation tests
    mcp: MCP AI-assisted tests
    